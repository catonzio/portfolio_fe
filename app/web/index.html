<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Danilo | Portfolio</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Full screen container using flexbox to center the spinner */
   body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Spinner animation */
    #loading {
      width: 100px;
      height: 100px;
      border: 8px solid rgba(0, 0, 0, 0.1);
      border-top-color: #313131;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    /* HTML: <div class="loader"></div> */
    .loader {
      width: 70px;
      height: 40px;
      outline: 2px solid #fff;
      background:
        radial-gradient(farthest-side,red 90%,#0000) 0 0/8px 8px no-repeat,
        radial-gradient(farthest-side,#FFF 90%,#0000) 0 0/8px 8px no-repeat,
        linear-gradient(#000 0 0) 50%/10px 100% no-repeat,
        conic-gradient(from  90deg at 10px 10px,#0000 90deg,#000 0),
        conic-gradient(from -90deg at 60px 30px,#0000 90deg,#000 0);
      animation: l9 2s infinite;
    }
    @keyframes l9 {
      0%    {background-position:50%  100%,0    0   ,50%}
      12.5% {background-position:0    100%,50%  0   ,50%}
      25%   {background-position:0    0   ,50%  100%,50%}
      37.5% {background-position:50%  0   ,100% 100%,50%}
      50%   {background-position:50%  100%,100% 0   ,50%}
      62.5% {background-position:100% 100%,50%  0   ,50%}
      75%   {background-position:100% 0   ,50%  100%,50%}
      82.5% {background-position:50%  0   ,0    100%,50%}
      100%  {background-position:50%  100%,0    0   ,50%}
    }

    @keyframes spin {
      100% {
        transform: rotate(360deg); /* Rotate the spinner */
      }
    }

    /* Hide the spinner after Flutter app loads */
    body.flutter-loaded #loading .loader {
      display: none;
    }
  </style>

  <script>
    // The value below is injected by flutter build, do not touch.
    const serviceWorkerVersion = null;

    window.addEventListener('load', function(ev) {
      // Download main.dart.js
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            // Hide the spinner once Flutter app has loaded
            document.body.classList.add('flutter-loaded');
            appRunner.runApp();
          });
        }
      });
    });
  </script>

  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>
</head>
<body>
  <!-- Loading animation -->
  <!-- <div id="loading"></div> -->
  <div class="loader"></div>
</body>
</html>
